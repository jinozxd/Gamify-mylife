<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude du ngoạn Hạ Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Mali:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap">
<style>
:root{
  /* Layout: full-bleed canvas seascape; two quiet lacquer-glass panels pinned to the corners, the bay stays the hero */
  --lacquer: #0c1a21;
  --glass: rgba(8, 23, 29, .58);
  --glass-strong: rgba(8, 23, 29, .76);
  --hairline: rgba(238, 228, 205, .18);
  --silk: #f4ede0;
  --silk-dim: rgba(244, 237, 224, .72);
  --jade: #8ad6c0;
  --lantern: #f3c056;
  --sky-dawn: #f2a07f;
  --sky-day: #7cbfea;
  --sky-dusk: #e9875c;
  --sky-night: #0c1434;
  --sky-violet: #9b5a86;
  --display: "Playfair Display", "Times New Roman", Georgia, serif;
  --body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--lacquer); color: var(--silk);
  font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: fixed; inset: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  transition: opacity .4s ease;
}
.hud.off { opacity: 0; }
.hud.off * { pointer-events: none !important; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.brand { min-width: 0; text-shadow: 0 1px 14px rgba(0,0,0,.45); }
.eyebrow { font: 600 11px/1.3 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--jade); }
.brand h1 { font: italic 600 clamp(22px, 3vw, 34px)/1.08 var(--display); margin: 4px 0 0; text-wrap: balance; }
.clock {
  display: flex; align-items: center; gap: 10px; flex: none;
  background: var(--glass); border: 1px solid var(--hairline); border-radius: 14px;
  padding: 8px 12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.orb { width: 18px; height: 18px; border-radius: 50%; background: var(--lantern); box-shadow: 0 0 12px var(--lantern); transition: background .6s, box-shadow .6s; }
.orb.moon { background: var(--silk); box-shadow: 0 0 12px rgba(244,237,224,.7); }
.time { font: 600 24px/1 var(--body); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.phase { font: 500 12px/1.3 var(--body); color: var(--silk-dim); margin-top: 3px; }
.bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.place {
  min-width: 0; max-width: 410px; flex: 1 1 300px;
  background: var(--glass); border: 1px solid var(--hairline); border-radius: 16px;
  padding: 12px 14px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: opacity .5s ease, transform .5s ease;
}
.place.swap { opacity: 0; transform: translateY(6px); }
.where { font: 600 11px/1.3 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--lantern); }
.place h2 { font: 600 clamp(19px, 2.2vw, 25px)/1.15 var(--display); margin: 4px 0 6px; text-wrap: balance; }
.place p { margin: 0; font: 400 13.5px/1.5 var(--body); color: var(--silk-dim); max-width: 52ch; }
.outfit { margin-top: 9px; display: flex; gap: 8px; align-items: center; font: 500 12.5px/1.35 var(--body); }
.swatch { flex: none; width: 13px; height: 13px; border-radius: 4px; border: 1px solid rgba(255,255,255,.55); }
.dock {
  pointer-events: auto; flex: 0 1 380px; min-width: 0;
  background: var(--glass-strong); border: 1px solid var(--hairline); border-radius: 16px;
  padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 8px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn {
  appearance: none; border: 1px solid var(--hairline); background: rgba(255,255,255,.06); color: var(--silk);
  height: 32px; min-width: 32px; padding: 0 9px; border-radius: 9px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 12.5px/1 var(--body);
}
.btn:hover { background: rgba(255,255,255,.13); }
.btn:focus-visible, .timeline:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 9px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; min-width: 38px; background: transparent; font-variant-numeric: tabular-nums; }
.seg .btn[aria-pressed="true"] { background: var(--jade); color: var(--lacquer); }
.spacer { flex: 1; }
.timeline {
  position: relative; height: 22px; border-radius: 7px; cursor: pointer; touch-action: none;
  background: linear-gradient(90deg, var(--sky-dawn) 0%, var(--sky-day) 7%, var(--sky-day) 41%, var(--sky-dusk) 48%, var(--sky-violet) 52%, var(--sky-night) 58%, var(--sky-night) 93%, var(--sky-violet) 97%, var(--sky-dawn) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
}
.cut { position: absolute; top: 3px; bottom: 3px; width: 1px; background: rgba(255,255,255,.55); pointer-events: none; }
.headmark { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; border-radius: 3px; background: var(--silk); box-shadow: 0 0 10px var(--silk), 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
.hours { display: flex; justify-content: space-between; font: 500 10.5px/1 var(--body); color: var(--silk-dim); font-variant-numeric: tabular-nums; }
.show {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  appearance: none; border: 1px solid var(--hairline); background: var(--glass-strong); color: var(--silk);
  border-radius: 10px; padding: 8px 12px; font: 600 12.5px var(--body); cursor: pointer;
}
@media (max-width: 560px) {
  .place p { display: none; }
  .place { padding: 10px 12px; }
  .place h2 { font-size: 18px; margin-bottom: 2px; }
  .time { font-size: 20px; }
  .dock { flex-basis: 100%; }
  .controls { gap: 5px; }
  .seg .btn { min-width: 33px; }
  .btn { padding: 0 8px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .place p { display: none; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Hoạt hình: Claude mặc áo dài đi trên hòn đảo nhỏ quanh Vịnh Hạ Long cùng ba người bạn Chiikawa, Hachiware và Usagi, từ bình minh qua hoàng hôn đến đêm pháo hoa."></canvas>

<div class="hud" id="hud">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Vịnh Hạ Long · Quảng Ninh</div>
      <h1>Claude du ngoạn Hạ Long</h1>
    </div>
    <div class="clock">
      <span class="orb" id="orb"></span>
      <div>
        <div class="time" id="time">06:00</div>
        <div class="phase" id="phase">Bình minh</div>
      </div>
    </div>
  </header>

  <footer class="bottom">
    <section class="place" id="place" aria-live="polite">
      <div class="where" id="where">Bình minh</div>
      <h2 id="pname">Hòn Trống Mái</h2>
      <p id="pdesc"></p>
      <div class="outfit"><span class="swatch" id="swatch"></span><span id="poutfit"></span></div>
    </section>

    <section class="dock" aria-label="Điều khiển">
      <div class="controls">
        <button class="btn" id="prev" type="button" aria-label="Cảnh trước"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
        <button class="btn" id="play" type="button" aria-label="Tạm dừng"><svg viewBox="0 0 16 16" id="playIcon"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
        <button class="btn" id="next" type="button" aria-label="Cảnh sau"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
        <div class="seg" role="group" aria-label="Tốc độ">
          <button class="btn" type="button" data-speed="0.5" id="sp05" aria-pressed="false">½×</button>
          <button class="btn" type="button" data-speed="1" id="sp1" aria-pressed="true">1×</button>
          <button class="btn" type="button" data-speed="2" id="sp2" aria-pressed="false">2×</button>
          <button class="btn" type="button" data-speed="4" id="sp4" aria-pressed="false">4×</button>
        </div>
        <span class="spacer"></span>
        <button class="btn" id="hide" type="button">Ẩn bảng</button>
      </div>
      <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Giờ trong ngày" aria-valuemin="0" aria-valuemax="24" aria-valuenow="6">
        <div class="headmark" id="headmark"></div>
      </div>
      <div class="hours"><span>6h</span><span>12h</span><span>18h</span><span>0h</span><span>6h</span></div>
    </section>
  </footer>
</div>
<button class="show" id="show" type="button" hidden>Hiện bảng</button>

<script>
(() => {
'use strict';

/* ============================================================
   Tiện ích chung
   ============================================================ */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const probe = document.createElement('canvas').getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;
const fract = v => v - Math.floor(v);
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (a, b, c = 0) => fract(Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453);

const HEXC = new Map();
function hx(h) {
  let c = HEXC.get(h);
  if (!c) { const n = parseInt(h.slice(1), 16); c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; HEXC.set(h, c); }
  return c;
}
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const G = (h, a = 1) => rgba(hx(h), a);           // màu tự phát sáng (không chịu ánh sáng môi trường)

/* ============================================================
   Thời gian & không gian
   ============================================================ */
const CYCLE = 360;      // giây cho trọn một ngày ở tốc độ 1× (ngày 180 giây, đêm 180 giây)
const TRACK = 40000;    // quãng đường mỗi vòng ở lớp gần nhất (f = 1)
let W = 0, H = 0, DPR = 1, SC = 1, VW = 1400, VH = 800, HZ = 470, WL = 665, WLT = 665;
let p = 0.004, speed = 1, paused = false, st = 0, dist = 0, last = performance.now();

const wl = f => HZ + (WL - HZ) * Math.pow(f, 1.15);                 // mực nước của lớp f
const sx = (pc, f) => { let d = pc - p; d -= Math.round(d); return VW / 2 + d * TRACK * f; };
const onScreen = (x, half) => x + half > -40 && x - half < VW + 40;
const qOf = v => (v >= 0.96 ? v - 1 : v);

/* ============================================================
   Bầu trời theo giờ — bình minh, ngày, hoàng hôn, đêm
   p = 0 là 6h sáng, p = 0.5 là 18h; ngày và đêm chia đều
   ============================================================ */
const KEYS = [
  [0.020, '#4c74b2', '#f2a98a', '#ffd79c', [1.00, .80, .66], .06, .85, '#355a6c'],
  [0.070, '#5aa4dd', '#a8d5ee', '#eaf4ef', [1.00, .95, .88], 0, .55, '#24707a'],
  [0.180, '#3c8edc', '#84c5ee', '#d8f0f7', [1, 1, 1], 0, .22, '#1c6d7a'],
  [0.320, '#3a89d4', '#8cc5ea', '#e4f2f2', [1, .98, .94], 0, .18, '#1d6876'],
  [0.410, '#4f86c6', '#b8c9d8', '#f6dcaa', [1, .9, .76], 0, .25, '#2a5f6e'],
  [0.478, '#3f5190', '#e98a5a', '#ffb547', [1, .7, .46], .03, .35, '#40495f'],
  [0.512, '#2a2d5e', '#a24e6c', '#f27a4a', [.8, .54, .5], .25, .35, '#2c2d4a'],
  [0.545, '#11163b', '#352f66', '#74426c', [.46, .42, .58], .7, .25, '#161b37'],
  [0.59, '#060a21', '#0f1941', '#26305d', [.30, .33, .50], 1, .15, '#0b1229'],
  [0.920, '#060a21', '#0f1941', '#26305d', [.30, .33, .50], 1, .2, '#0b1229'],
  [0.955, '#151c46', '#3b3b73', '#8a5e86', [.42, .40, .57], .75, .45, '#16213d'],
  [0.985, '#2a376c', '#b4627f', '#ff9d6c', [.78, .58, .56], .35, .75, '#2b3753'],
].map(k => ({ p: k[0], top: hx(k[1]), mid: hx(k[2]), hz: hx(k[3]), light: k[4], night: k[5], mist: k[6], water: hx(k[7]) }));

const E = { sun: {}, moon: {}, flash: 0 };
function computeEnv() {
  let i = KEYS.length - 1;
  for (let j = 0; j < KEYS.length; j++) if (KEYS[j].p <= p) i = j;
  const a = KEYS[i], b = KEYS[(i + 1) % KEYS.length];
  let pa = a.p, pb = b.p, qq = p;
  if (pb <= pa) { pb += 1; if (qq < pa) qq += 1; }
  const t = sstep(0, 1, (qq - pa) / (pb - pa));
  E.top = mixc(a.top, b.top, t); E.mid = mixc(a.mid, b.mid, t); E.hz = mixc(a.hz, b.hz, t);
  E.light = mixc(a.light, b.light, t); E.night = lerp(a.night, b.night, t);
  E.mist = lerp(a.mist, b.mist, t); E.water = mixc(a.water, b.water, t);
  E.fog = mixc(E.hz, E.mid, 0.3);
  E.clight = mixc(E.light, [1, 1, 1], 0.55);

  const q = qOf(p);
  // Mặt trời: mọc ~6h, lặn ~18h
  const sT = (q + 0.03) / 0.56;
  const sun = E.sun;
  sun.vis = sstep(-0.02, 0.02, sT) * sstep(-0.02, 0.02, 1 - sT);
  sun.e = Math.max(0, Math.sin(Math.PI * clamp(sT, 0, 1)));
  sun.x = VW * (0.3 + 0.45 * clamp(sT, 0, 1));
  sun.y = HZ + 20 - Math.pow(sun.e, 0.6) * HZ * 0.92;
  // Trăng
  let mq = p < 0.4 ? p + 1 : p;
  const mT = (mq - 0.49) / 0.53;
  const moon = E.moon;
  moon.vis = sstep(-0.02, 0.03, mT) * sstep(-0.02, 0.03, 1 - mT);
  moon.e = Math.max(0, Math.sin(Math.PI * clamp(mT, 0, 1)));
  moon.x = VW * (0.12 + 0.55 * clamp(mT, 0, 1));
  moon.y = HZ + 20 - Math.pow(moon.e, 0.6) * HZ * 0.78;

  E.warm = sun.vis * (1 - sstep(0.12, 0.5, sun.e));
  const day = sun.vis > 0.02;
  E.side = Math.sign((day ? sun.x : moon.x) - VW / 2) || 1;
  E.rimCol = day ? mixc(hx('#fff1cf'), hx('#ffb066'), E.warm) : hx('#c9d6ff');
  E.rim = day ? sun.vis * (0.12 + 0.5 * E.warm) : moon.vis * 0.22 * E.night;
}
function SA(h, fog = 0) {
  const c = typeof h === 'string' ? hx(h) : h, L = E.light, F = E.fog;
  return [lerp(c[0] * L[0], F[0], fog), lerp(c[1] * L[1], F[1], fog), lerp(c[2] * L[2], F[2], fog)];
}
const S = (h, fog = 0, a = 1) => rgba(SA(h, fog), a);
function CS(h, a = 1) { const c = hx(h), L = E.clight; return `rgba(${c[0] * L[0] | 0},${c[1] * L[1] | 0},${c[2] * L[2] | 0},${a})`; }

/* ============================================================
   Hình học núi đá vôi (karst) — gồ ghề, ngấn nước, cây bám vách
   ============================================================ */
function polyPath(pts) {
  const p2 = new Path2D();
  p2.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p2.lineTo(pts[i][0], pts[i][1]);
  p2.closePath();
  return p2;
}
function craggy(pts, step, amp, R) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const n = Math.max(1, Math.round(len / step));
    const nx = -dy / len, ny = dx / len;
    const flat = Math.abs(a[1]) < 0.5 && Math.abs(b[1]) < 0.5;
    for (let k = 0; k < n; k++) {
      const t = k / n;
      const j = (k === 0 || flat) ? 0 : (R() - 0.5) * 2 * amp;
      out.push([a[0] + dx * t + nx * j, Math.min(0, a[1] + dy * t + ny * j)]);
    }
  }
  return out;
}
// Tháp karst: vách dốc, đỉnh tròn, chân bị sóng khoét (ngấn nước)
function karstOutline(w, h, R, o = {}) {
  const k = o.k || (3 + R() * 3), m = o.m || (1.4 + R() * 1.6), lean = (R() - 0.5) * (o.lean ?? 0.35);
  const n = o.n || 20;
  const ph1 = R() * TAU, ph2 = R() * TAU, ph3 = R() * TAU;
  const L = [], Rt = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    let hw = (w / 2) * Math.pow(Math.max(0, 1 - Math.pow(t, k)), 1 / m);
    if (t < 0.08) hw *= 0.8 + t * 2.5;
    const c = lean * w * t * t;
    const nl = 1 + 0.12 * Math.sin(t * 7 + ph1) + 0.06 * Math.sin(t * 17 + ph2);
    const nr = 1 + 0.12 * Math.sin(t * 8 + ph2) + 0.06 * Math.sin(t * 15 + ph3);
    L.push([c - hw * nl, -t * h]);
    Rt.push([c + hw * nr, -t * h]);
  }
  return L.concat(Rt.reverse().slice(1));
}

function buildRock(outline, o = {}) {
  const R = rng(o.seed || 7);
  const pts = craggy(outline, o.step || 5, o.amp ?? 2, R);
  const path = polyPath(pts);
  if (o.hole) { const q = o.hole; path.moveTo(q.x + q.rx, q.y); path.ellipse(q.x, q.y, q.rx, q.ry, 0, 0, TAU); }
  let minX = 1e9, maxX = -1e9, minY = 1e9, bL = 1e9, bR = -1e9, area = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = pts[i], nb = pts[(i + 1) % pts.length];
    if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y;
    if (y > -1.5) { if (x < bL) bL = x; if (x > bR) bR = x; }
    area += x * nb[1] - nb[0] * y;
  }
  const h = -minY, w = maxX - minX, sg = area > 0 ? 1 : -1;
  const inside = (x, y) => probe.isPointInPath(path, x, y, 'evenodd');
  const veg = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  const clump = (x, y, r) => {
    veg[0].moveTo(x + r * 1.1, y + r * 0.3); veg[0].arc(x, y + r * 0.3, r * 1.1, 0, TAU);
    const tg = R() < 0.4 ? veg[3] : veg[1];
    tg.moveTo(x + r, y); tg.arc(x, y, r, 0, TAU);

const PAL = ['#ff5a5a', '#ffd34d', '#5ad2ff', '#c07bff', '#6dff9a', '#ff86d9', '#ffffff', '#ffa94d'];

}
function burst(x, y, sc, drift, type, ci) {
  const types = ['peony', 'peony', 'ring', 'willow', 'heart', 'star', 'palm', 'crackle', 'double'];
  type = type || types[(Math.random() * types.length) | 0];
  const c2 = (ci + 1 + ((Math.random() * (PAL.length - 1)) | 0)) % PAL.length;
  const V = (150 + Math.random() * 60) * sc;
  const add = (vx, vy, o = {}) => FW.parts.push({ x, y, vx, vy, life: o.life || 1.6 + Math.random() * 0.5, max: o.life || 1.9, ci: o.ci ?? ci, c2: o.c2 ?? -1, drag: o.drag || 1.5, g: (o.g || 55) * sc, tr: o.tr || 0.07, flick: !!o.flick, drift });
  if (type === 'ring') {
    const tilt = (Math.random() - 0.5) * 1.2, n = 64;
    for (let i = 0; i < n; i++) { const a = i / n * TAU; let vx = Math.cos(a) * V, vy = Math.sin(a) * V * 0.45; const c = Math.cos(tilt), s = Math.sin(tilt); add(vx * c - vy * s, vx * s + vy * c); }
    for (let i = 0; i < 30; i++) { const a = Math.random() * TAU, v = Math.random() * V * 0.4; add(Math.cos(a) * v, Math.sin(a) * v, { ci: c2 }); }
  } else if (type === 'heart') {
    for (let i = 0; i < 80; i++) { const tt = i / 80 * TAU; const hxv = 16 * Math.pow(Math.sin(tt), 3), hyv = -(13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt)); add(hxv / 16 * V * 0.9, hyv / 16 * V * 0.9, { ci: 5, g: 25 }); }
  } else if (type === 'star') {
    for (let i = 0; i < 100; i++) { const a = i / 100 * TAU - Math.PI / 2; const k = (i % 20) / 20; const r = 0.45 + 0.55 * Math.abs(1 - 2 * k); add(Math.cos(a) * V * r, Math.sin(a) * V * r, { ci: 1, g: 25 }); }
    for (let i = 0; i < 50; i++) { const a = Math.random() * TAU, v = V * (0.85 + Math.random() * 0.25); add(Math.cos(a) * v, Math.sin(a) * v, { ci: 0 }); }
  } else if (type === 'willow') {
    for (let i = 0; i < 90; i++) { const a = Math.random() * TAU, v = V * (0.5 + 0.5 * Math.sqrt(Math.random())); add(Math.cos(a) * v, Math.sin(a) * v, { ci: 7, life: 2.8 + Math.random() * 0.8, drag: 1.9, g: 70, tr: 0.2, flick: true }); }
  } else if (type === 'palm') {
    for (let k = 0; k < 9; k++) { const a = k / 9 * TAU + Math.random() * 0.3; for (let i = 0; i < 9; i++) { const v = V * (0.4 + i * 0.08); add(Math.cos(a) * v, Math.sin(a) * v, { ci: 1, tr: 0.09, g: 70 }); } }
  } else {
    const n = type === 'double' ? 150 : 140;
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = V * (0.82 + 0.18 * Math.random()); add(Math.cos(a) * v, Math.sin(a) * v, { c2: type === 'crackle' ? 6 : c2, flick: type === 'crackle' }); }
    if (type === 'double') for (let i = 0; i < 60; i++) { const a = Math.random() * TAU, v = V * 0.45; add(Math.cos(a) * v, Math.sin(a) * v, { ci: c2 }); }
  }

    ctx.beginPath(); ctx.ellipse(cx - a * 150, WL + 4, IR + 10 + a * 110, 15 + a * 13, 0, 0.05, Math.PI - 0.05); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i < 16; i++) { const xx = cx - IR - mod(dist + i * 37, 560), yy = WL + 6 + (i % 3) * 6; ctx.moveTo(xx, yy); ctx.lineTo(xx + 16 + (i % 4) * 5, yy); }
  ctx.stroke();
  if (N > 0.3) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 46; i++) {
      const xx = cx - IR + 10 - mod(dist + i * 41, 600) + Math.sin(i * 7) * 10, yy = WL + 2 + hash(i, 3) * 30;
      const a = N * (0.5 + 0.5 * Math.sin(t * 5 + i * 2.1));
      ctx.fillStyle = `rgba(120,240,255,${a * 0.75})`; ctx.fillRect(xx, yy, 2, 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.fillStyle = 'rgba(0,18,28,0.28)'; ell(cx, y + 10, IR + 14, 18); ctx.fill();
  // chân đảo bằng đá
  ctx.fillStyle = CS('#7d7366');
  ctx.beginPath(); ctx.ellipse(cx, top, IR, IRY, 0, 0, Math.PI);
  for (let i = 0; i <= 24; i++) { const xx = cx + IR - 2 - i * (IR * 2 - 4) / 24; ctx.lineTo(xx, y + 4 + Math.sin(i * 1.7) * 3); }
  ctx.closePath(); ctx.fill();
  const rg = ctx.createLinearGradient(0, top + 4, 0, y + 5);
  rg.addColorStop(0, 'rgba(255,255,255,0.12)'); rg.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = rg; ctx.fill();
  ctx.strokeStyle = 'rgba(40,30,20,0.25)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 18; i++) { const xx = cx - IR + 20 + i * 27; ctx.moveTo(xx, top + 16 + Math.sin(i) * 2); ctx.lineTo(xx + 6, y + 2); }
  ctx.stroke();
  ctx.fillStyle = CS('#4f8f3a');
  for (let i = 0; i < 11; i++) { ell(cx - IR + 30 + i * 44, top + 15 + Math.sin(i * 2) * 3, 11, 4.5); ctx.fill(); }
  // mặt cát
  const sg = ctx.createLinearGradient(0, top - IRY, 0, top + IRY);
  sg.addColorStop(0, CS('#f3e3b4')); sg.addColorStop(1, CS('#e2c287'));
  ctx.fillStyle = sg; ell(cx, top, IR - 1, IRY - 0.5); ctx.fill();
  ctx.fillStyle = CS('#6fb04a');
  for (let i = 0; i < 9; i++) { const xx = cx - IR + 50 + i * 50; ell(xx, top - IRY + 5 + Math.abs(i - 4) * 1.4, 19, 4.4); ctx.fill(); }
  ctx.strokeStyle = CS('#5a9a3a'); ctx.lineWidth = 1.3; ctx.beginPath();
  for (let i = 0; i < 34; i++) { const xx = cx - IR + 30 + i * 13.5; ctx.moveTo(xx, top - IRY + 6); ctx.lineTo(xx - 2 + Math.sin(t * 2 + i) * 1.6, top - IRY - 2); }
  ctx.stroke();
  // vỏ sò, sao biển, đá cuội
  ctx.fillStyle = CS('#f28b6b'); starPath(ctx, cx + 82, top + 12, 5.5, 2.4); ctx.fill();
  ctx.fillStyle = CS('#fff4e6'); ell(cx - 70, top + 11, 3.6, 2.4); ctx.fill(); ell(cx + 168, top + 6, 3, 2.2); ctx.fill();
  ctx.fillStyle = CS('#a39a8a'); ell(cx - 200, top + 6, 6, 3.5); ctx.fill(); ell(cx + 214, top + 2, 5, 3); ctx.fill();
  palm(cx - 206, top - 8, t, N);
  return y;
}
function drawIslandFront(cx, y, t) {
  const N = E.night, top = y - 30;
  // cờ đỏ sao vàng
  ctx.fillStyle = CS('#d9d9d9'); ctx.fillRect(cx + 232, top - 92, 2.4, 92);
  vnFlag(cx + 234.4, top - 92, 36, 24, t, 0, 2.6);
  ctx.fillStyle = CS('#8a8170'); ell(cx + 233, top + 1, 6, 3); ctx.fill();
  // đèn dây quanh mép đảo
  if (N > 0.05) {
    ctx.globalCompositeOperation = 'lighter';
    const cols = ['#ff6b6b', '#ffd34d', '#6be0ff', '#b48bff', '#7dff9a'];
    for (let i = 0; i <= 34; i++) {
      const a = Math.PI * (0.05 + 0.9 * i / 34);
      const lx = cx - Math.cos(a) * IR, ly = top + Math.sin(a) * IRY + 1;
      const on = 0.55 + 0.45 * Math.sin(t * 3 + i * 0.9);
      const c = cols[i % cols.length];
      glow(lx, ly, 10, c, 0.45 * N * on);
      ctx.fillStyle = G(c, N * (0.6 + 0.4 * on)); ell(lx, ly, 2, 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ============================================================
   Bong bóng lời thoại
   ============================================================ */
function bubble(x, y, text, a) {
  ctx.font = '700 16px Mali, "Be Vietnam Pro", system-ui, sans-serif';
  const w = ctx.measureText(text).width + 26, h = 32;
  const bx = clamp(x - w / 2, 8, VW - w - 8), by = y - h - 12;
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(20,20,30,0.18)';
  ctx.beginPath(); ctx.roundRect(bx + 2, by + 3, w, h, 12); ctx.fill();
  ctx.fillStyle = '#fffdf6';
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(clamp(x, bx + 14, bx + w - 14) - 6, by + h - 1); ctx.lineTo(clamp(x, bx + 14, bx + w - 14), by + h + 9); ctx.lineTo(clamp(x, bx + 14, bx + w - 14) + 6, by + h - 1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2b2522'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + w / 2, by + h / 2 + 1);
  ctx.globalAlpha = 1;
}

/* ============================================================
   Vẽ nhân vật trên đảo theo chặng
   ============================================================ */
let lastScene = -1, releasedLantern = false, emitT = 0;
function drawCharacters(cx, y, t, dt) {
  const si = sceneIndex(p), sc = SCENES[si], lt = sceneLT(sc);
  if (si !== lastScene) {
    if (lastScene !== -1) {
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * TAU, v = 30 + Math.random() * 70;
        fx(E.night > 0.5 ? 'sparkle' : (Math.random() < 0.5 ? 'petal' : 'sparkle'), cx + Math.cos(a) * 40, y - 95 + Math.sin(a) * 40, { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: 1 + Math.random() * 0.6, col: E.night > 0.5 ? '#ffe7a3' : (Math.random() < 0.5 ? '#ffc0d0' : '#fff6c8') });
      }
    }
    lastScene = si; releasedLantern = false;
    updatePlace(sc);
  }
  const ps = claudeState(sc, lt, t);
  if (sc.id === 'dem-khuya' && lt >= 0.4 && !releasedLantern) {
    releasedLantern = true;
    FLOATERS.push({ x: cx + 60, f: 1.08, ph: Math.random() * TAU });
  }
  if (FLOATERS.length > 6) FLOATERS.shift();
  const pace = ps.walk ? Math.sin(t * 0.35) * 18 : 0;
  const order = [
    ['chiikawa', cx - 148, y - 36, 1.42],
    ['claude', cx + pace, y - 30, 12],
    ['hachiware', cx + 132, y - 24, 1.45],
    ['usagi', cx + 200, y - 34, 1.34],
  ].sort((a, b) => a[2] - b[2]);
  const fs = {};
  for (const [who, x, gy, s] of order) {
    if (who === 'claude') drawClawd(x, gy, s, sc.outfit, ps, t);
    else { const st2 = friendState(sc, who, lt, t); fs[who] = st2; const top = drawChibi(who, x, gy, s, st2, t); HEADS[who] = [x, top]; }
  }
  // hiệu ứng theo chặng
  emitT += dt;
  if (emitT > 0.25) {
    emitT = 0;
    if (sc.id === 'hoang-hon' && Math.random() < 0.45) fx('heart', cx + (Math.random() - 0.5) * 70, y - 150, { vx: (Math.random() - 0.5) * 10, vy: -26, life: 2, col: '#ff7a9a', s: 0.9 + Math.random() * 0.4 });
    if (sc.id === 'dem-khuya' && lt > 0.4) {
      if (Math.random() < 0.3) fx('z', HEADS.claude[0] + 30, HEADS.claude[1] + 20, { vx: 8, vy: -16, life: 2.2, col: '#dfe6ff', txt: 'z' });
      for (const w of ['chiikawa', 'hachiware', 'usagi']) if (fs[w] && fs[w].sleep && Math.random() < 0.12) fx('z', HEADS[w][0] + 10, HEADS[w][1] + 10, { vx: 6, vy: -14, life: 2, col: '#dfe6ff', txt: 'z', s: 0.8 });
    }
    if (sc.id === 'binh-minh' && ps.mouth === 'yawn' && Math.random() < 0.3) fx('z', HEADS.claude[0] + 34, HEADS.claude[1] + 30, { vx: 6, vy: -12, life: 1.5, col: '#ffffff', txt: 'z', s: 0.8 });
    if (E.night > 0.6 && Math.random() < 0.55) fx('sparkle', Math.random() * VW, HZ - 160 + Math.random() * (WL - HZ + 120), { vx: (Math.random() - 0.5) * 8, vy: -6 - Math.random() * 8, life: 1.6 + Math.random(), col: Math.random() < 0.5 ? '#fff1b8' : '#bfe8ff', s: 0.45 + Math.random() * 0.4 });
    if (sc.id === 'ti-top' && Math.random() < 0.2) fx('sparkle', cx + (Math.random() - 0.5) * 420, WL + 12 + Math.random() * 50, { life: 0.8, col: '#ffffff', s: 0.8 });
    if (sc.id === 'lang-chai' && ps.bite && Math.random() < 0.6) fx('sparkle', cx + 160 + Math.random() * 50, WL + 8, { vy: -30, life: 0.6, col: '#d8f4ff', s: 0.8 });
  }
  return sc;
}
function drawBubbles(sc) {
  const lt = sceneLT(sc);
  for (const [who, a, b, text] of sc.lines) {
    if (lt < a || lt > b || !HEADS[who]) continue;
    const k = Math.min(sstep(a, a + 0.03, lt), 1 - sstep(b - 0.03, b, lt));
    bubble(HEADS[who][0], HEADS[who][1], text, k);
  }
}

/* ============================================================
   Vòng lặp chính
   ============================================================ */
function render(rdt, dt) {
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  const q = qOf(p);
  drawSky();
  drawStars();
  drawSunMoon();
  drawClouds();
  drawBirds();
  drawSea();
  drawGlitter(HZ, wl(F_SHORE));
  drawTowers(FAR0); mistBand(wl(0.055), 50, E.mist * 0.55);
  drawTowers(FAR1); mistBand(wl(0.1), 60, E.mist * 0.45);
  drawBoats(0, 0.2);
  drawTowers(MID); mistBand(wl(0.17), 70, E.mist * 0.38);
  drawWaves(0, F_SHORE);
  drawBoats(0.2, F_SHORE);
  drawFireworks();
  drawBohon();
  drawCountry(); drawSchool(); drawSunWorld(); drawCity();
  drawGlitter(wl(F_SHORE), VH);
  drawFireworksRefl();
  drawWaves(F_SHORE, 0.42);
  drawBoats(F_SHORE, 0.42);
  for (const r of SEC) { const x = sx(r.pc, 0.42); if (onScreen(x, r.rock.w)) drawRock(r.rock, x, wl(0.42), 1, 0.16); }
  drawTitop();
  drawVillage();
  mistBand(wl(0.42), 40, E.mist * 0.25);
  drawWaves(0.42, 0.55);
  drawBoats(0.42, 0.55);
  for (const r of HERO) { const x = sx(r.pc, 0.55); if (onScreen(x, r.rock.w)) drawRock(r.rock, x, wl(0.55), 1, 0.06); }
  for (const n of NAMED) { const x = sx(n.pc, n.f); if (onScreen(x, n.half)) n.draw(x, wl(n.f), 0.05); }
  drawWaves(0.55, 3);
  drawBoats(0.55, 1);
  drawHoaDang(0, 1);
  const cx = VW / 2;
  const iy = drawIsland(cx, st);
  const sc = drawCharacters(cx, iy, st, dt);
  drawIslandFront(cx, iy, st);
  drawHoaDang(1, 3);
  drawFX();
  drawBubbles(sc);
  // viền tối nhẹ
  const vg = ctx.createRadialGradient(VW / 2, VH * 0.55, Math.min(VW, VH) * 0.35, VW / 2, VH * 0.55, Math.max(VW, VH) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(5,8,20,${0.18 + E.night * 0.22})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
}

function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const dt = paused ? 0 : rdt * speed;
  if (!paused) {
    const dp = dt / CYCLE;
    p = mod(p + dp, 1);
    st += dt; dist += dp * TRACK;
    shiftWorld(dp);
  }
  WLT = targetWL();
  if (Math.abs(WLT - WL) > 0.2) { WL += (WLT - WL) * Math.min(1, rdt * 4); HZ = WL - 195; }
  computeEnv();
  const q = qOf(p);
  if (!paused) {
    updateFireworks(rdt * Math.min(speed, 1.5), q);
    updateFX(dt);
    if (!RM && E.night > 0.8 && Math.random() < rdt * 0.12 * speed) SHOOT.push({ x: Math.random() * VW, y: Math.random() * HZ * 0.4, vx: -260 - Math.random() * 200, vy: 120 + Math.random() * 80, life: 0.9, max: 0.9 });
    for (let i = SHOOT.length - 1; i >= 0; i--) { const s = SHOOT[i]; s.x += s.vx * rdt; s.y += s.vy * rdt; s.life -= rdt; if (s.life <= 0) SHOOT.splice(i, 1); }
    for (let i = FLOATERS.length - 1; i >= 0; i--) if (FLOATERS[i].x < -60) FLOATERS.splice(i, 1);
  }
  render(rdt, dt);
  updateHUD();
  requestAnimationFrame(frame);
}

// Mực nước của hòn đảo: chừa chỗ cho bảng điều khiển phía dưới (nhất là trên điện thoại)
let bottomH = 0;
function measureHUD() {
  const bottom = document.querySelector('.bottom');
  const on = !document.getElementById('hud').classList.contains('off');
  bottomH = on && bottom ? bottom.getBoundingClientRect().height + 22 : 0;
}
function targetWL() { return VH - Math.max(135, Math.min(bottomH / SC, VH * 0.42)); }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
  SC = Math.min(H / 800, W / 720);
  VW = W / SC; VH = H / SC;
  measureHUD();
  WL = WLT = targetWL(); HZ = WL - 195;
  buildStars();
}

/* ============================================================
   Bảng điều khiển
   ============================================================ */
const $ = id => document.getElementById(id);
const hud = $('hud'), place = $('place');
const timeline = $('timeline'), headmark = $('headmark');
for (const sc of SCENES) {
  if (sc.start <= 0) continue;
  const d = document.createElement('div');
  d.className = 'cut'; d.style.left = (sc.start * 100) + '%';
  timeline.appendChild(d);
}
{ const d = document.createElement('div'); d.className = 'cut'; d.style.left = '96%'; timeline.appendChild(d); }

function updatePlace(sc) {
  place.classList.add('swap');
  setTimeout(() => {
    $('where').textContent = sc.where;
    $('pname').textContent = sc.name;
    $('pdesc').textContent = sc.desc;
    $('poutfit').textContent = sc.outfit.label;
    $('swatch').style.background = sc.outfit.dress;
    place.classList.remove('swap');
  }, 260);
}
let lastMin = -1;
function phaseName(h) {
  if (h >= 5 && h < 7) return 'Bình minh';
  if (h >= 7 && h < 11) return 'Buổi sáng';
  if (h >= 11 && h < 13) return 'Buổi trưa';
  if (h >= 13 && h < 16.5) return 'Buổi chiều';
  if (h >= 16.5 && h < 19) return 'Hoàng hôn';
  if (h >= 19 && h < 22) return 'Buổi tối';
  if (h >= 22) return 'Đêm';
  return 'Khuya';
}
function updateHUD() {
  const hrs = mod(6 + p * 24, 24);
  const mins = Math.floor(hrs * 60);
  if (mins !== lastMin) {
    lastMin = mins;
    const hh = String(Math.floor(mins / 60)).padStart(2, '0'), mm = String(mins % 60).padStart(2, '0');
    $('time').textContent = `${hh}:${mm}`;
    $('phase').textContent = phaseName(hrs);
    $('orb').classList.toggle('moon', E.sun.vis < 0.3);
    timeline.setAttribute('aria-valuenow', hrs.toFixed(1));
    timeline.setAttribute('aria-valuetext', `${hh} giờ ${mm}`);
  }
  headmark.style.left = (p * 100) + '%';
}
function jumpTo(v) {
  p = mod(v, 1);
  FW.parts.length = 0; FW.rockets.length = 0; FW.flashes.length = 0;
}
function setPaused(v) {
  paused = v;
  $('play').setAttribute('aria-label', v ? 'Phát' : 'Tạm dừng');
  $('playIcon').innerHTML = v ? '<path d="M4 2l10 6-10 6z"/>' : '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
}
function setSpeed(v) {
  speed = v;
  document.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.speed) === v)));
}
function stepScene(dir) {
  const i = sceneIndex(p);
  const j = mod(i + dir, SCENES.length);
  jumpTo(SCENES[j].jump);
}
$('play').addEventListener('click', () => setPaused(!paused));
$('prev').addEventListener('click', () => stepScene(-1));
$('next').addEventListener('click', () => stepScene(1));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
$('hide').addEventListener('click', () => { hud.classList.add('off'); $('show').hidden = false; $('show').focus(); measureHUD(); });
$('show').addEventListener('click', () => { hud.classList.remove('off'); $('show').hidden = true; measureHUD(); });
if (window.ResizeObserver) new ResizeObserver(measureHUD).observe(document.querySelector('.bottom'));
let dragging = false;
const tlSet = e => { const r = timeline.getBoundingClientRect(); jumpTo(clamp((e.clientX - r.left) / r.width, 0, 0.9999)); };
timeline.addEventListener('pointerdown', e => { dragging = true; timeline.setPointerCapture(e.pointerId); tlSet(e); });
timeline.addEventListener('pointermove', e => { if (dragging) tlSet(e); });
timeline.addEventListener('pointerup', () => { dragging = false; });
timeline.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { jumpTo(p + 1 / 96); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { jumpTo(p - 1 / 96); e.preventDefault(); }
});
window.addEventListener('keydown', e => {
  if (e.target === timeline) return;
  if (e.code === 'Space' && e.target === document.body) { setPaused(!paused); e.preventDefault(); }
  if (e.key === 'ArrowRight' && e.target === document.body) stepScene(1);
  if (e.key === 'ArrowLeft' && e.target === document.body) stepScene(-1);
  if ((e.key === 'h' || e.key === 'H') && e.target === document.body) { const off = hud.classList.toggle('off'); $('show').hidden = !off; measureHUD(); }
});
window.addEventListener('resize', resize);

// Liên kết sâu: #binh-minh, #thanh-pho, ...
function fromHash() {
  const id = (location.hash || '').slice(1);
  const sc = SCENES.find(s => s.id === id);
  if (sc) jumpTo(sc.jump);
}
window.addEventListener('hashchange', fromHash);

if (document.fonts && document.fonts.load) {
  Promise.all(['700 14px Mali', '700 8px "Be Vietnam Pro"'].map(f => document.fonts.load(f, 'Chào Hạ Long ạ'))).catch(() => {});
}

// Móc gỡ lỗi: tua tới một thời điểm và chạy từng khung hình (dùng khi chụp ảnh kiểm tra)
window.__halong = { set: v => { jumpTo(v); }, pause: v => setPaused(v), get p() { return p; }, step: (n, d = 1 / 30) => { for (let i = 0; i < n; i++) frameStep(d); } };
function frameStep(d) {
  const dp = d / CYCLE; p = mod(p + dp, 1); st += d; dist += dp * TRACK; shiftWorld(dp);
  computeEnv(); updateFireworks(d, qOf(p)); updateFX(d); render(d, d);
}

function start(data) {
  if (data && typeof data.p === 'number') { p = data.p; setSpeed(data.speed || 1); setPaused(!!data.paused); }
  resize();
  fromHash();
  computeEnv();
  last = performance.now();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ p, speed, paused }));
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
